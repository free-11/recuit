spring:
  application:
    name: recruit

  datasource:
    url: jdbc:mysql://localhost:3306/recruit?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8082

mybatis-plus:

    type-aliases-package: org.example.recruit.entity

    configuration:

      map-underscore-to-camel-case: true

      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

global-config:
      db-config:
        id-type: auto




